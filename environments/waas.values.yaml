# ===========================================================================
# environments/waas.values.yaml — personal GCP learning lab (cluster airflow-waas)
#
# A copy of dev.values.yaml with two differences:
#   1. Sign-in uses Google (no groups claim): `groups` scope removed, groups
#      emptied, OIDC_ALLOW_ALL_AUTHENTICATED "true". The real gate is the
#      project's OAuth Audience (Internal accounts only).
#   2. The ingress is bound to the reserved static IP `waas-ip`.
#
#   scripts/deploy.sh --env waas --domain waas.anujwalia.com \
#     --image <registry>/airflow-workspace:<tag> --cpu 1 --memory 8G
# ===========================================================================

platform:
  domain: ""          # set at deploy time
  resourceQuota:
    enabled: true
    hard:
      requests.cpu: "8"
      requests.memory: 120Gi
      limits.cpu: "8"
      limits.memory: 120Gi
      persistentvolumeclaims: "20"
      count/pods: "20"
  gke:
    enabled: true
    managedCertificate:
      enabled: true

jupyterhub:
  hub:
    db:
      type: sqlite-pvc
      pvc:
        storage: 2Gi
        storageClassName: premium-rwo
    extraEnv:
      OIDC_ALLOWED_GROUPS: ""
      OIDC_OPERATOR_GROUPS: ""
      OIDC_ALLOW_ALL_AUTHENTICATED: "true"
    config:
      GenericOAuthenticator:
        login_service: "Google"
        scope:
          - openid
          - profile
          - email
        manage_groups: false

  ingress:
    ingressClassName: gce
    annotations:
      kubernetes.io/ingress.allow-http: "true"
      # Binds the load balancer to the reserved global address `waas-ip`
      # (gcloud compute addresses create waas-ip --global). Without this the
      # ingress gets an ephemeral IP that changes if the ingress is recreated.
      kubernetes.io/ingress.global-static-ip-name: waas-ip
      networking.gke.io/managed-certificates: airflow-dev-platform-cert
      networking.gke.io/v1beta1.FrontendConfig: airflow-dev-platform-frontend

  proxy:
    service:
      annotations:
        cloud.google.com/backend-config: '{"default":"airflow-dev-platform-hub"}'

  singleuser:
    image:
      name: REPLACE_ME/airflow-workspace   # set by scripts/deploy.sh --image
      tag: "3.3.2"

    # Smaller than production, to keep the dev cluster cheap. The production
    # default is 1 CPU / 16G; see environments/prod.values.yaml.
    cpu:
      limit: 1
      guarantee: 0.5
    memory:
      limit: 8G
      guarantee: 4G

    storage:
      capacity: 10Gi
      dynamic:
        storageClass: premium-rwo

  cull:
    timeout: 1800     # 30 minutes idle
    maxAge: 28800     # 8 hours absolute

  scheduling:
    userPlaceholder:
      replicas: 0
    # A single-pool dev cluster usually has no purpose-labelled nodes.
    corePods:
      nodeAffinity:
        matchNodePurpose: prefer
    userPods:
      nodeAffinity:
        matchNodePurpose: prefer

  debug:
    enabled: true
